<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Background -->
  <rect width="300" height="300" fill="#ffffff" />

  <!-- Outer Square Border -->
  <rect x="8" y="8" width="284" height="284" fill="none" stroke="#111111" stroke-width="2.5" />

  <!-- Inner Square Border -->
  <rect x="14" y="14" width="272" height="272" fill="none" stroke="#111111" stroke-width="3.5" />

  <!-- PASAYA Main Wordmark (High-contrast Serif Display Typography) -->
  <g fill="#111111" font-family="'Didot', 'Bodoni MT', 'Cinzel', 'Playfair Display', serif" font-weight="900" text-anchor="middle">
    <text x="150" y="148" font-size="76" letter-spacing="1" transform="scale(1, 1.18)" style="transform-origin: 150px 140px;">PASAYA</text>
  </g>

  <!-- CURTAIN CENTER Sub-Wordmark -->
  <g fill="#111111" font-family="'Prompt', 'Inter', 'Arial', sans-serif" font-weight="800" text-anchor="middle">
    <text x="150" y="200" font-size="28" letter-spacing="8">CURTAIN</text>
    <text x="150" y="238" font-size="25" letter-spacing="14">CENTER</text>
  </g>
</svg>
